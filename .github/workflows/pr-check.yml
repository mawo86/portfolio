name: PR Check

# Baut die Website auf jedem Pull Request, damit main nie rot wird.
# Kein Deploy. Link-Check ist Pflicht, Größen-Budget nur Warnung.
on:
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (astro + pagefind, identisch zum Deploy)
        working-directory: website
        run: npm run build

      - name: Interne Links prüfen
        working-directory: website
        run: npm run check:links

      - name: Größen-Budget (nur Warnung)
        working-directory: website
        continue-on-error: true
        run: npm run check:budget

      - name: Build-Artefakt für Review
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7
